spring.application.name=backend

# Database connection comes from environment variables (defaults match docker-compose.yml).
# To use AWS Aurora PostgreSQL later, just set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtracker}
spring.datasource.username=${DB_USER:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker}

# Flyway creates the tables; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
