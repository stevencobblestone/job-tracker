# Whole app:      docker compose up -d --build   -> open http://localhost:3000
# Database only:  docker compose up -d db        (when running backend/frontend yourself)
services:
  db:
    image: postgres:16
    container_name: jobtracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtracker}
      POSTGRES_USER: ${DB_USER:-jobtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobtracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobtracker} -d ${DB_NAME:-jobtracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: jobtracker-backend
    environment:
      DB_HOST: db                         # the database container's name
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobtracker}
      DB_USER: ${DB_USER:-jobtracker}
      DB_PASSWORD: ${DB_PASSWORD:-jobtracker}
      TZ: ${TZ:-America/New_York}         # so "today" (auto-filled applied date) matches your clock
    depends_on:
      db:
        condition: service_healthy        # wait until Postgres is ready

  frontend:
    build: ./frontend
    container_name: jobtracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
