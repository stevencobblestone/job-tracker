spring.application.name=backend

# Web server port. Hosting platforms like Render set PORT; locally it's 8080.
server.port=${PORT:8080}

# Database connection comes from environment variables (defaults match docker-compose.yml).
# To use a hosted database (Neon, AWS Aurora, ...), set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
# DB_PARAMS adds extra connection options, e.g. "?sslmode=require" for hosted databases that need SSL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtracker}${DB_PARAMS:}
spring.datasource.username=${DB_USER:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker}

# Flyway creates the tables; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Public demo: load sample data at startup and reset it nightly. Never enable on real data!
app.demo-data=${DEMO_DATA:false}
