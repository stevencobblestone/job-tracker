server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the backend container ("backend" is its name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Everything else is the Angular app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
